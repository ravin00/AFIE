[project]
name = "afie-ml"
version = "0.1.0"
description = "AFIE reinforcement-learning agent — Phase 5"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "rich>=13",
]

[project.scripts]
afie-train-offline = "afie_ml.train_offline:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pandas-stubs>=2.2",
    "pytest-httpserver>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["afie_ml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afie_ml"]

[tool.hatch.build.targets.wheel.force-include]
"afie_ml/py.typed" = "afie_ml/py.typed"