apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Base: all AFIE app manifests for the afie-system namespace.
# Overlays (overlays/dev, overlays/prod) layer env-specific patches on top.
resources:
  - afie-postgres.sealed.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - afie-fe-state-pvc.yaml
  - afie-telemetry-data-pvc.yaml
  - resource-defaults.yaml
  - network-policies.yaml
  - pdbs.yaml
  - feature-engineering-deployment.yaml
  - telemetry-deployment.yaml
  - servicemonitors.yaml
  - nginx-test.yaml
