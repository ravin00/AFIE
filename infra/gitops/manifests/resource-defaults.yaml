apiVersion: v1
kind: LimitRange
metadata: { name: default, namespace: afie-system }
spec:
  limits:
    - type: Container
      default:        { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max:            { cpu: "2",  memory: 2Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: default, namespace: afie-system }
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
