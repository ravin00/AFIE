apiVersion: apps/v1
kind: Deployment
metadata:
  name: afie-feature-engineering
  namespace: afie-system
  labels:
    app: afie-feature-engineering
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: state-vector-builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: afie-feature-engineering
  template:
    metadata:
      labels:
        app: afie-feature-engineering
        app.kubernetes.io/part-of: afie
        afie.dev/purpose: state-vector-builder
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: afie-telemetry
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z afie-postgres 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: feature-engineering
          image: afie-feature-engineering:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FeatureEngineering__ConsumerMode
              value: "local"
            - name: FeatureEngineering__PublisherMode
              value: "postgres"
            - name: FeatureEngineering__InputPath
              value: "/app/data"
            - name: FeatureEngineering__OffsetStatePath
              value: "/app/experiments/state/fe_consumer_offset.json"
            - name: FeatureEngineering__PostgresConnectionString
              valueFrom:
                secretKeyRef:
                  name: afie-postgres
                  key: CONNECTION_STRING
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: telemetry-in
              mountPath: /app/data
              readOnly: true
            - name: fe-state
              mountPath: /app/experiments/state
      volumes:
        - name: telemetry-in
          persistentVolumeClaim:
            claimName: afie-telemetry-data
            readOnly: true
        - name: fe-state
          persistentVolumeClaim:
            claimName: afie-fe-state
---
apiVersion: v1
kind: Service
metadata:
  name: afie-feature-engineering
  namespace: afie-system
  labels:
    app: afie-feature-engineering
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: state-vector-builder
spec:
  type: ClusterIP
  selector:
    app: afie-feature-engineering
  ports:
    - name: http
      port: 8080
      targetPort: 8080