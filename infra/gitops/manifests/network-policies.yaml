apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: afie-system }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: fe-to-postgres, namespace: afie-system }
spec:
  podSelector: { matchLabels: { app: afie-feature-engineering } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: afie-postgres } } }]
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-from-fe, namespace: afie-system }
spec:
  podSelector: { matchLabels: { app: afie-postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: afie-feature-engineering } } }]
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-prom-scrape, namespace: afie-system }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: fe-http, namespace: afie-system }
spec:
  podSelector: { matchLabels: { app: afie-feature-engineering } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080 }]
