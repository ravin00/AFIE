apiVersion: v1
kind: Service
metadata:
  name: afie-postgres
  namespace: afie-system
  labels:
    app: afie-postgres
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: state-vector-store
spec:
  type: ClusterIP
  selector:
    app: afie-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432