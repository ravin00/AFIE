apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: afie-postgres
  namespace: afie-system
  labels:
    app: afie-postgres
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: state-vector-store
spec:
  serviceName: afie-postgres
  replicas: 1
  selector:
    matchLabels:
      app: afie-postgres
  template:
    metadata:
      labels:
        app: afie-postgres
        app.kubernetes.io/part-of: afie
        afie.dev/purpose: state-vector-store
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: afie-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi