# Missing `---` separators + `restricted` PSA would break postgres init (runAsUser:0).
# Baseline enforce + restricted warn = real security floor without blocking existing workloads.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: observability
    # node-exporter needs hostNetwork/hostPath/hostPort — baseline blocks that.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: afie-system
  labels:
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: baseline-manual
  labels:
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: baseline
    afie.dev/baseline: manual
---
apiVersion: v1
kind: Namespace
metadata:
  name: baseline-vpa
  labels:
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: baseline
    afie.dev/baseline: vpa
---
apiVersion: v1
kind: Namespace
metadata:
  name: baseline-threshold
  labels:
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: baseline
    afie.dev/baseline: threshold
---
apiVersion: v1
kind: Namespace
metadata:
  name: baseline-afie
  labels:
    app.kubernetes.io/part-of: afie
    afie.dev/purpose: baseline
    afie.dev/baseline: afie
