apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: afie
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: afie
  revisionHistoryLimit: 10
  source:
    repoURL: https://github.com/ravin00/AFIE.git
    targetRevision: main          # pin to a release tag for prod (see #8)
    path: infra/gitops/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: afie-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m