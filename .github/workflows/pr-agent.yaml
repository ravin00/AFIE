name: pr-agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975  # v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenRouter (LiteLLM-compatible). One key, many providers.
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER.API_BASE: "https://openrouter.ai/api/v1"
          # Auto-run on new PRs; other commands (/review, /describe, /improve,
          # /ask <q>, /update_changelog) are triggered by comments.
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"  # noisy on WIP branches
          # Cheap + solid default; swap for openrouter/anthropic/claude-sonnet-4-5
          # if review quality falls short.
          CONFIG.MODEL: "openrouter/google/gemini-2.5-flash"
          CONFIG.FALLBACK_MODELS: '["openrouter/anthropic/claude-3.5-haiku"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "1000000"
          # Trim noise paths from context.
          IGNORE.GLOB: '["graphify-out/**", "**/node_modules/**", "**/.venv/**", "scripts/graphify-mcp/**"]'
